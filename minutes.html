<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회의록</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Gowun Dodum", sans-serif; background: #f1f5f9; min-height: 100vh; }

      /* 상단 바 */
      .top-bar {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #fff;
        padding: 12px 24px;
        display: flex;
        align-items: center;
        gap: 14px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      }
      .top-bar a { color: #fff; text-decoration: none; font-size: 1.2rem; }
      .top-bar h1 { font-size: 1rem; flex: 1; }

      /* 컨테이너 */
      .container { max-width: 960px; margin: 32px auto; padding: 0 16px 60px; }

      /* 필터 바 */
      .filter-bar {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
        flex-wrap: wrap;
        align-items: center;
      }
      .filter-bar input[type="text"],
      .filter-bar input[type="date"],
      .filter-bar select {
        padding: 8px 12px;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        font-family: inherit;
        font-size: 0.85rem;
        background: #fff;
        color: #1e293b;
        outline: none;
      }
      .filter-bar input[type="text"] { flex: 1; min-width: 160px; }
      .filter-bar input[type="text"]:focus,
      .filter-bar input[type="date"]:focus,
      .filter-bar select:focus { border-color: #7c3aed; }
      .filter-label { font-size: 0.8rem; color: #64748b; white-space: nowrap; }

      /* 헤더 */
      .board-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .board-title { font-size: 1.1rem; font-weight: 700; color: #1e293b; }
      .btn-write {
        padding: 8px 20px;
        background: #7c3aed;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-family: inherit;
        font-size: 0.88rem;
        cursor: pointer;
      }
      .btn-write:hover { background: #6d28d9; }

      /* 목록 */
      .minute-list {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.07);
        overflow: hidden;
      }
      .minute-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 20px;
        border-bottom: 1px solid #f1f5f9;
        cursor: pointer;
        transition: background 0.15s;
      }
      .minute-item:last-child { border-bottom: none; }
      .minute-item:hover { background: #f8fafc; }
      .minute-num { font-size: 0.8rem; color: #94a3b8; width: 36px; flex-shrink: 0; text-align: center; }
      .minute-info { flex: 1; min-width: 0; }
      .minute-title { font-size: 0.92rem; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .minute-meta { font-size: 0.72rem; color: #94a3b8; margin-top: 3px; }
      .minute-badge {
        font-size: 0.7rem;
        padding: 2px 8px;
        border-radius: 10px;
        background: #ede9fe;
        color: #7c3aed;
        flex-shrink: 0;
        white-space: nowrap;
      }
      .minute-date { font-size: 0.78rem; color: #94a3b8; flex-shrink: 0; white-space: nowrap; }
      .empty-msg { padding: 40px; text-align: center; color: #94a3b8; font-size: 0.88rem; }

      /* 모달 공통 */
      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.45);
        z-index: 100;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .modal-overlay.open { display: flex; }
      .modal {
        background: #fff;
        border-radius: 16px;
        width: 100%;
        max-width: 720px;
        max-height: 92vh;
        overflow-y: auto;
        box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      }
      .modal-header {
        padding: 18px 22px 14px;
        border-bottom: 1px solid #f1f5f9;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        background: #fff;
        z-index: 1;
      }
      .modal-header h2 { font-size: 1rem; color: #1e293b; }
      .modal-close { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #94a3b8; line-height: 1; }
      .modal-body { padding: 20px 22px; }
      .modal-footer {
        padding: 12px 22px 18px;
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        border-top: 1px solid #f1f5f9;
      }

      /* 상세 뷰 */
      .detail-title { font-size: 1.1rem; font-weight: 700; color: #1e293b; margin-bottom: 8px; }
      .detail-meta {
        font-size: 0.78rem;
        color: #94a3b8;
        margin-bottom: 14px;
        padding-bottom: 14px;
        border-bottom: 1px solid #f1f5f9;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .detail-meta span { display: flex; align-items: center; gap: 4px; }
      .detail-content { font-size: 0.9rem; color: #334155; line-height: 1.85; white-space: pre-wrap; }

      /* AI 요약 박스 */
      .ai-summary-box {
        margin-top: 16px;
        padding: 14px 16px;
        background: #faf5ff;
        border: 1px solid #e9d5ff;
        border-radius: 10px;
        font-size: 0.88rem;
        color: #4c1d95;
        line-height: 1.75;
        display: none;
      }
      .ai-summary-box.show { display: block; }
      .ai-summary-label { font-size: 0.75rem; font-weight: 700; color: #7c3aed; margin-bottom: 6px; }

      /* 폼 */
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .form-grid .full { grid-column: 1 / -1; }
      .form-field { margin-bottom: 0; }
      .form-field label { display: block; font-size: 0.82rem; color: #64748b; margin-bottom: 5px; }
      .form-field input,
      .form-field select,
      .form-field textarea {
        width: 100%;
        padding: 9px 12px;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        font-family: inherit;
        font-size: 0.88rem;
        outline: none;
        color: #1e293b;
        background: #f8fafc;
      }
      .form-field input:focus,
      .form-field select:focus,
      .form-field textarea:focus { border-color: #7c3aed; background: #fff; }
      .form-field textarea { resize: vertical; min-height: 200px; line-height: 1.75; }

      /* 참석자 선택 */
      .attendee-select-wrap {
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        background: #f8fafc;
        max-height: 140px;
        overflow-y: auto;
        padding: 6px 4px;
      }
      .attendee-select-wrap label {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 8px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.85rem;
        color: #1e293b;
        margin-bottom: 0;
      }
      .attendee-select-wrap label:hover { background: #ede9fe; }
      .attendee-select-wrap input[type="checkbox"] { accent-color: #7c3aed; width: 14px; height: 14px; }

      /* 버튼 */
      .btn-cancel {
        padding: 8px 18px;
        border: 1px solid #e2e8f0;
        background: #f8fafc;
        border-radius: 8px;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.85rem;
        color: #475569;
      }
      .btn-submit {
        padding: 8px 22px;
        background: #7c3aed;
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.85rem;
      }
      .btn-submit:hover { background: #6d28d9; }
      .btn-delete {
        padding: 8px 18px;
        background: #fee2e2;
        color: #ef4444;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.85rem;
        margin-right: auto;
      }
      .btn-delete:hover { background: #fecaca; }
      .btn-edit {
        padding: 8px 18px;
        background: #f1f5f9;
        color: #475569;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.85rem;
      }
      .btn-edit:hover { background: #ede9fe; color: #7c3aed; }
      .btn-ai {
        padding: 8px 18px;
        background: #faf5ff;
        color: #7c3aed;
        border: 1px solid #e9d5ff;
        border-radius: 8px;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.85rem;
      }
      .btn-ai:hover { background: #ede9fe; }
      .btn-ai:disabled { opacity: 0.6; cursor: default; }

      @media (max-width: 600px) {
        .form-grid { grid-template-columns: 1fr; }
        .filter-bar input[type="text"] { min-width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="top-bar">
      <a href="/">&#8592;</a>
      <h1>📝 회의록</h1>
    </div>

    <div class="container">
      <!-- 헤더 -->
      <div class="board-header">
        <span class="board-title">회의록 목록</span>
        <button class="btn-write" onclick="openWriteModal()">+ 새 회의록</button>
      </div>

      <!-- 필터 -->
      <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="제목 또는 내용 검색..." oninput="debounceLoad()" />
        <span class="filter-label">기간</span>
        <input type="date" id="filterFrom" onchange="loadMinutes()" />
        <span class="filter-label">~</span>
        <input type="date" id="filterTo" onchange="loadMinutes()" />
        <select id="filterCategory" onchange="loadMinutes()">
          <option value="">전체 카테고리</option>
        </select>
        <button class="btn-cancel" onclick="clearFilters()">초기화</button>
      </div>

      <!-- 목록 -->
      <div class="minute-list" id="minuteList">
        <div class="empty-msg">불러오는 중...</div>
      </div>
    </div>

    <!-- 상세 모달 -->
    <div class="modal-overlay" id="detailModal">
      <div class="modal">
        <div class="modal-header">
          <h2>회의록 상세</h2>
          <button class="modal-close" onclick="closeModal('detailModal')">×</button>
        </div>
        <div class="modal-body">
          <div class="detail-title" id="detailTitle"></div>
          <div class="detail-meta" id="detailMeta"></div>
          <div class="detail-content" id="detailContent"></div>
          <div class="ai-summary-box" id="aiSummaryBox">
            <div class="ai-summary-label">✨ AI 요약</div>
            <div id="aiSummaryText"></div>
          </div>
        </div>
        <div class="modal-footer" id="detailFooter"></div>
      </div>
    </div>

    <!-- 작성/수정 모달 -->
    <div class="modal-overlay" id="writeModal">
      <div class="modal">
        <div class="modal-header">
          <h2 id="writeModalTitle">새 회의록</h2>
          <button class="modal-close" onclick="closeModal('writeModal')">×</button>
        </div>
        <div class="modal-body">
          <div class="form-grid">
            <div class="form-field full">
              <label>제목 *</label>
              <input type="text" id="inputTitle" placeholder="회의 제목을 입력하세요" />
            </div>
            <div class="form-field">
              <label>회의 일시 *</label>
              <input type="datetime-local" id="inputDate" />
            </div>
            <div class="form-field">
              <label>장소</label>
              <input type="text" id="inputLocation" placeholder="예: 2층 회의실 A" />
            </div>
            <div class="form-field">
              <label>카테고리</label>
              <input type="text" id="inputCategory" placeholder="예: 주간회의, 기획, 팀미팅" />
            </div>
            <div class="form-field">
              <label>참석자</label>
              <div class="attendee-select-wrap" id="attendeeList">
                <div style="padding:8px;font-size:0.8rem;color:#94a3b8">로딩 중...</div>
              </div>
            </div>
            <div class="form-field full">
              <label>회의 내용 *</label>
              <textarea id="inputContent" placeholder="회의 내용, 결정 사항, 액션 아이템 등을 입력하세요..."></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-cancel" onclick="closeModal('writeModal')">취소</button>
          <button class="btn-submit" id="writeSubmitBtn" onclick="submitMinute()">등록</button>
        </div>
      </div>
    </div>

    <script src="/js/config.js"></script>
    <script>
      let me = null;
      let editingId = null;
      let allUsers = [];
      let currentDetailId = null;
      let searchTimer = null;

      async function init() {
        me = await checkAuth();
        if (!me) return;
        await loadUsers();
        await loadCategories();
        await loadMinutes();
      }

      function fmtDate(s) {
        if (!s) return "-";
        const d = new Date(s);
        return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }
      function pad(n) { return String(n).padStart(2, "0"); }
      function esc(s) {
        return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
      }

      async function loadUsers() {
        const res = await apiFetch("/api/attendance/users");
        if (res.ok) allUsers = await res.json();
      }

      async function loadCategories() {
        try {
          const res = await apiFetch("/api/minutes/meta/categories");
          if (!res.ok) return;
          const cats = await res.json();
          const sel = document.getElementById("filterCategory");
          cats.forEach(c => {
            const opt = document.createElement("option");
            opt.value = c; opt.textContent = c;
            sel.appendChild(opt);
          });
        } catch {}
      }

      async function loadMinutes() {
        const q = document.getElementById("searchInput").value.trim();
        const from = document.getElementById("filterFrom").value;
        const to = document.getElementById("filterTo").value;
        const category = document.getElementById("filterCategory").value;

        const params = new URLSearchParams();
        if (q) params.set("q", q);
        if (from) params.set("from", from);
        if (to) params.set("to", to);
        if (category) params.set("category", category);

        const res = await apiFetch("/api/minutes?" + params.toString());
        const list = await res.json();
        const el = document.getElementById("minuteList");

        if (!list.length) {
          el.innerHTML = '<div class="empty-msg">회의록이 없습니다.</div>';
          return;
        }
        el.innerHTML = list.map((m, i) => `
          <div class="minute-item" onclick="openDetail(${m.id})">
            <div class="minute-num">${list.length - i}</div>
            <div class="minute-info">
              <div class="minute-title">${esc(m.title)}</div>
              <div class="minute-meta">
                ${esc(m.author_name || m.author_email)}
                ${m.attendee_names ? ` · 참석: ${esc(m.attendee_names)}` : ""}
                ${m.location ? ` · ${esc(m.location)}` : ""}
              </div>
            </div>
            <span class="minute-badge">${esc(m.category || "일반")}</span>
            <div class="minute-date">${fmtDate(m.meeting_date)}</div>
          </div>`).join("");
      }

      function debounceLoad() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(loadMinutes, 300);
      }

      function clearFilters() {
        document.getElementById("searchInput").value = "";
        document.getElementById("filterFrom").value = "";
        document.getElementById("filterTo").value = "";
        document.getElementById("filterCategory").value = "";
        loadMinutes();
      }

      async function openDetail(id) {
        currentDetailId = id;
        document.getElementById("aiSummaryBox").classList.remove("show");
        document.getElementById("aiSummaryText").textContent = "";

        const res = await apiFetch(`/api/minutes/${id}`);
        const m = await res.json();

        document.getElementById("detailTitle").textContent = m.title;

        const attendeeNames = m.attendees?.map(a => a.name || a.email).join(", ") || "-";
        document.getElementById("detailMeta").innerHTML = `
          <span>📅 ${fmtDate(m.meeting_date)}</span>
          <span>📍 ${esc(m.location || "장소 미지정")}</span>
          <span>🏷 ${esc(m.category || "일반")}</span>
          <span>✍️ ${esc(m.author_name || m.author_email)}</span>
          <span>👥 ${esc(attendeeNames)}</span>`;
        document.getElementById("detailContent").textContent = m.content;

        const canEdit = (me && (me.id === m.author_id || ["admin","ceo"].includes(me.role)));
        const footer = document.getElementById("detailFooter");
        footer.innerHTML = `
          <button class="btn-ai" id="btnAiSummary" onclick="summarize(${id})">✨ AI 요약</button>
          ${canEdit ? `
            <button class="btn-delete" onclick="deleteMinute(${id})">삭제</button>
            <button class="btn-edit" onclick="openEditModal(${id})">수정</button>` : ""}
          <button class="btn-cancel" onclick="closeModal('detailModal')">닫기</button>`;

        document.getElementById("detailModal").classList.add("open");
      }

      async function summarize(id) {
        const btn = document.getElementById("btnAiSummary");
        btn.disabled = true;
        btn.textContent = "요약 중...";
        try {
          const res = await apiFetch(`/api/minutes/${id}/summarize`, { method: "POST" });
          const data = await res.json();
          document.getElementById("aiSummaryText").textContent = data.summary || data.error;
          document.getElementById("aiSummaryBox").classList.add("show");
        } catch {
          Swal.fire({ icon: "error", title: "오류", text: "AI 요약에 실패했습니다." });
        } finally {
          btn.disabled = false;
          btn.textContent = "✨ AI 요약";
        }
      }

      function renderAttendeeList(selectedIds = []) {
        const wrap = document.getElementById("attendeeList");
        if (!allUsers.length) {
          wrap.innerHTML = '<div style="padding:8px;font-size:0.8rem;color:#94a3b8">멤버가 없습니다.</div>';
          return;
        }
        wrap.innerHTML = allUsers.map(u => `
          <label>
            <input type="checkbox" value="${u.id}" ${selectedIds.includes(u.id) ? "checked" : ""} />
            ${esc(u.name || u.email)}
          </label>`).join("");
      }

      function getSelectedAttendees() {
        return Array.from(
          document.querySelectorAll("#attendeeList input[type='checkbox']:checked")
        ).map(cb => Number(cb.value));
      }

      function openWriteModal() {
        editingId = null;
        document.getElementById("writeModalTitle").textContent = "새 회의록";
        document.getElementById("inputTitle").value = "";
        document.getElementById("inputDate").value = "";
        document.getElementById("inputLocation").value = "";
        document.getElementById("inputCategory").value = "";
        document.getElementById("inputContent").value = "";
        document.getElementById("writeSubmitBtn").textContent = "등록";
        renderAttendeeList();
        document.getElementById("writeModal").classList.add("open");
      }

      async function openEditModal(id) {
        const res = await apiFetch(`/api/minutes/${id}`);
        const m = await res.json();
        editingId = id;
        document.getElementById("writeModalTitle").textContent = "회의록 수정";
        document.getElementById("inputTitle").value = m.title;
        document.getElementById("inputDate").value = m.meeting_date
          ? new Date(m.meeting_date).toISOString().slice(0, 16) : "";
        document.getElementById("inputLocation").value = m.location || "";
        document.getElementById("inputCategory").value = m.category || "";
        document.getElementById("inputContent").value = m.content;
        document.getElementById("writeSubmitBtn").textContent = "수정";
        renderAttendeeList((m.attendees || []).map(a => a.id));
        closeModal("detailModal");
        document.getElementById("writeModal").classList.add("open");
      }

      async function submitMinute() {
        const title = document.getElementById("inputTitle").value.trim();
        const meeting_date = document.getElementById("inputDate").value;
        const location = document.getElementById("inputLocation").value.trim();
        const category = document.getElementById("inputCategory").value.trim();
        const content = document.getElementById("inputContent").value.trim();
        const attendee_ids = getSelectedAttendees();

        if (!title || !content || !meeting_date) {
          Swal.fire({ icon: "warning", title: "입력 오류", text: "제목, 회의 일시, 내용은 필수입니다." });
          return;
        }

        const body = { title, content, meeting_date, location, category: category || "일반", attendee_ids };

        if (editingId) {
          await apiFetch(`/api/minutes/${editingId}`, { method: "PUT", body: JSON.stringify(body) });
        } else {
          await apiFetch("/api/minutes", { method: "POST", body: JSON.stringify(body) });
        }
        closeModal("writeModal");
        await loadMinutes();
        await loadCategories();
      }

      async function deleteMinute(id) {
        const result = await Swal.fire({
          title: "회의록을 삭제하시겠습니까?",
          icon: "warning",
          showCancelButton: true,
          confirmButtonText: "삭제",
          cancelButtonText: "취소",
          confirmButtonColor: "#ef4444",
        });
        if (!result.isConfirmed) return;
        await apiFetch(`/api/minutes/${id}`, { method: "DELETE" });
        closeModal("detailModal");
        await loadMinutes();
      }

      function closeModal(id) {
        document.getElementById(id).classList.remove("open");
      }

      document.querySelectorAll(".modal-overlay").forEach(el => {
        el.addEventListener("click", e => { if (e.target === el) el.classList.remove("open"); });
      });

      init();
    </script>
  </body>
</html>
